name:  720_call_reusable.yml

## REF: Reuseable 
##      https://docs.github.com/en/actions/reference/workflows-and-actions/reusable-workflows

## job1 uses workflow in SAME directory, note:  must be called at the JOB level

on:
  push:
    branches:
      - dev

jobs:
  call-workflow:    # must be at job level, not step
      uses: ./.github/workflows/710_reuseable_workflow.yml
      with:
        name: jim

  call-peter-evans:   # job2
    name: the_call
    runs-on:  ubuntu-latest
    needs: call-workflow

    steps:
        # The 'checkout' action is required to access files in your repository.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Issue From File
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: An example issue
          content-filepath: ./.github/workflows/120_files.yml
          assignees: jimrothstein
          labels: |
            report
            automated issue

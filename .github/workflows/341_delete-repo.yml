name: Delete Repo

on:
  workflow_dispatch:
    inputs:
      repo_name:
        description: 'Repository to delete (format: owner/repo)'
        required: true

env:
  GH_TOKEN: ${{ secrets.OPENCODE }}

jobs:
  delete-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Sanitize token
        run: |
          echo "GH_TOKEN=$(echo "$GH_TOKEN" | xargs)" >> $GITHUB_ENV

      - name: Delete repository
        run: gh repo delete "${{ inputs.repo_name }}" --yes

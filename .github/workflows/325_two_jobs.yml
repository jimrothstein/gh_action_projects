name: 325_two_jobs

# job1 has 2 outputs, used in job2
on:
  workflow_dispatch:

run-name:  ${{ github.run_number }}, ${{ github.event_name }}, branch is ${{ github.headref || github.ref_name }}, actor= ${{ github.actor }}
jobs:
  job1:
    runs-on: ubuntu-latest
    # Map a step output to a job output
    outputs:
      output1: ${{ steps.step1.outputs.test }}
      output2: ${{ steps.step2.outputs.test }}
    steps:
      - id: step1
        run: echo "test=hello" >> "$GITHUB_OUTPUT"
      - id: step2
        run: echo "test=world" >> "$GITHUB_OUTPUT"
  job2:
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - env:
          OUTPUT1: ${{needs.job1.outputs.output1}}
          OUTPUT2: ${{needs.job1.outputs.output2}}
        run: echo "$OUTPUT1 $OUTPUT2" >> $GITHUB_STEP_SUMMARY

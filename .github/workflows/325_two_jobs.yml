name: 325_two_jobs

on:
  workflow_dispatch:

run-name:  ${{ github.run_number }}, {{ github.event_name }}, branch is ${{ github.headref || github.ref_name }}, actor= ${{ github.actor }}
jobs:
  job1:
    runs-on: ubuntu-latest
    # Define job outputs here that you want to pass to other jobs
    outputs:
      my_output_from_job1: ${{ steps.set_output_step.outputs.value_from_step }}

    steps:
      - name: built-in
        run: |
          echo "100_buit_in"
          echo "SHA = ${{ github.sha }}" # Use github.sha directly here
          echo "value_from_step=dog" >> "$GITHUB_OUTPUT"

  job2:
    runs-on: ubuntu-latest
    needs: [job1]

    steps:
      - name: Check condition and print output from job1
        # Correct syntax for 'contains' in an 'if' condition
        # and accessing output from a previous job using needs.job_id.outputs.output_name
        #if: contains(needs.job1.outputs.my_output_from_job1, 'dog')
        run: |
          echo "Output from job1: ${{ needs.job1.outputs.my_output_from_job1 }}"
          echo "The condition evaluated to true!"
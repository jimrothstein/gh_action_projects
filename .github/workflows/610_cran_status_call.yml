---
# Source: https://github.com/pharmaverse/admiralci
name: CRAN Status Monitor

on:
  # 'workflow_dispatch' gives you the ability
  # to run this workflow on demand, anytime
  workflow_dispatch:
  # 'schedule' events are triggered on a schedule
  schedule:
    - cron: '1 0 * * 1,3,5'
  push:

jobs:
  cran-status:
---
name: CRAN Status

on:
  workflow_dispatch:
    inputs:
      issue-assignees:
        description: |
          Whom should the issue be assigned to if errors are
          encountered in the CRAN status checks?
          This is a comma-separated string of GitHub usernames.
          If undefined or empty, no assignments are made.
        default: ""
        required: false
        type: string
      statuses:
        description: |
          Create an issue if one or more of the following
          statuses are reported on the check report.
          This is a comma-separated string of statuses.
          Allowed statuses are 'NOTE', 'WARN', and 'ERROR'
        default: "ERROR"
        required: false
        type: string
      path:
        description: |
          Path to the R package root, if the package is not at the
          top level of the repository.
        default: "."
        required: false
        type: string
  workflow_call:
    inputs:
      issue-assignees:
        description: |
          Whom should the issue be assigned to if errors are
          encountered in the CRAN status checks?
          This is a comma-separated string of GitHub usernames.
          If undefined or empty, no assignments are made.
        default: ""
        required: false
        type: string
      statuses:
        description: |
          Create an issue if one or more of the following
          statuses are reported on the check report.
          This is a comma-separated string of statuses.
          Allowed statuses are 'NOTE', 'WARN', and 'ERROR'
        default: "ERROR"
        required: false
        type: string
      path:
        description: |
          Path to the R package root, if the package is not at the
          top level of the repository.
        default: "."
        required: false
        type: string

permissions: write-all

concurrency:
  group: cran-status-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cran-status:
    runs-on: ubuntu-latest
    if:  github.ref_name == 'dev'
    container:
      image: rocker/tidyverse:latest

    steps:
      - name: Check cran-status
        uses: pharmaverse/admiralci/.github/workflows/cran-status.yml@main
        with:
            # Whom should the issue be assigned to if errors are encountered
            # in the CRAN status checks?
            #issue-assignees: "bundfussr,zdz2101,manciniedoardo,bms63"
          issue-assignees: "jimrothstein"
            # Create an issue if one or more of the following
            # statuses are reported on the check report.
          statuses: "WARN,ERROR,NOTE"
